name: Publish release images

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: Publish GHCR release images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push backend release image
        id: backend
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/wwending/math-knowledge-backend:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push web release image
        id: web
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/wwending/math-knowledge-web:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record published images
        env:
          GIT_SHA: ${{ github.sha }}
          BACKEND_IMAGE: ghcr.io/wwending/math-knowledge-backend:${{ github.sha }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          WEB_IMAGE: ghcr.io/wwending/math-knowledge-web:${{ github.sha }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          {
            echo "## GHCR release images"
            echo
            echo "Git SHA:"
            echo "${GIT_SHA}"
            echo
            echo "Backend:"
            echo "${BACKEND_IMAGE}"
            echo "Digest:"
            echo "${BACKEND_DIGEST}"
            echo
            echo "Web:"
            echo "${WEB_IMAGE}"
            echo "Digest:"
            echo "${WEB_DIGEST}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
