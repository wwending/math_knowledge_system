name: Publish release images

# Gate (#102): images are published only after the CI workflow has completed
# successfully for a push to main. A push whose CI run fails can no longer
# produce trusted-publisher digests for that SHA.
#
# In workflow_run context github.sha is the default-branch tip at event time,
# NOT necessarily the commit CI validated, so every SHA below must use
# github.event.workflow_run.head_sha (the triggering run's exact commit).
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: Publish GHCR release images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GIT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out validated commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push backend release image
        id: backend
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/wwending/math-knowledge-backend:${{ env.GIT_SHA }}
          build-args: |
            GIT_SHA=${{ env.GIT_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.GIT_SHA }}

      - name: Build and push web release image
        id: web
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/wwending/math-knowledge-web:${{ env.GIT_SHA }}
          build-args: |
            GIT_SHA=${{ env.GIT_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.GIT_SHA }}

      - name: Record published images
        env:
          BACKEND_IMAGE: ghcr.io/wwending/math-knowledge-backend:${{ env.GIT_SHA }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          WEB_IMAGE: ghcr.io/wwending/math-knowledge-web:${{ env.GIT_SHA }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          TRIGGERING_CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            echo "## GHCR release images"
            echo
            echo "Git SHA:"
            echo "${GIT_SHA}"
            echo
            echo "Backend:"
            echo "${BACKEND_IMAGE}"
            echo "Digest:"
            echo "${BACKEND_DIGEST}"
            echo
            echo "Web:"
            echo "${WEB_IMAGE}"
            echo "Digest:"
            echo "${WEB_DIGEST}"
            echo
            echo "Gating CI run (must be green):"
            echo "${TRIGGERING_CI_RUN_URL}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
