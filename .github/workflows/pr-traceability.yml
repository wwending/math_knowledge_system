name: PR traceability

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  traceability:
    name: PR traceability
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Validate linked Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/check-pr-traceability.test.mjs
          node scripts/check-pr-traceability.mjs
