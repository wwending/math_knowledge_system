name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci_test.db
      SECRET_KEY: ci-only-placeholder-secret-key-32-chars
      AUTH_STRICT_SECURITY: "false"
      OCR_PROVIDER: baidu
      BAIDU_API_KEY: ""
      BAIDU_SECRET_KEY: ""
      DEEPSEEK_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"

      - name: Compile backend
        run: python -m compileall app

      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend contract tests
        run: npm run test:stage3-contract

      - name: Build frontend
        run: npm run build
