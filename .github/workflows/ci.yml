name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci_test.db
      SECRET_KEY: ci-only-placeholder-secret-key-32-chars
      AUTH_STRICT_SECURITY: "false"
      OCR_PROVIDER: baidu
      BAIDU_API_KEY: ""
      BAIDU_SECRET_KEY: ""
      DEEPSEEK_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"

      - name: Compile backend
        run: python -m compileall app

      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Report dependency install scripts
        run: npm run security:list-install-scripts

      - name: Run frontend contract tests
        run: npm run test:stage3-contract

      - name: Build frontend
        run: npm run build

  deployment:
    name: Production stack checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Prepare placeholder deployment environment
        run: cp deploy/.env.production.example deploy/.env

      - name: Check deployment script syntax
        run: bash -n deploy/scripts/deploy.sh deploy/scripts/backup.sh

      - name: Run Nginx static proxy contract test
        run: bash deploy/tests/test_nginx_static_proxy.sh

      - name: Validate Compose configuration
        run: docker compose --env-file deploy/.env -f compose.prod.yml config

      - name: Build production images
        run: docker compose --env-file deploy/.env -f compose.prod.yml build
